<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Memory Card -->
        <aside class="memory-panel glass-panel">
            <header>
                <h2>Customer Memory</h2>
                <div class="customer-selector">
                    <select id="customer-select">
                        <option value="cust-101">Alice Smith (Recurring Issue)</option>
                        <option value="cust-102">Bob Jones (Frustrated)</option>
                        <option value="cust-103">Charlie Brown (New Customer)</option>
                        <option value="cust-104">Diana Prince (Normal)</option>
                        <option value="cust-105">Eve Adams (Quirky Env)</option>
                    </select>
                </div>
            </header>
            
            <div class="memory-content" id="memory-content">
                <!-- Populated by JS -->
                <div class="loading-state">Select a customer...</div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-panel glass-panel">
            <header class="chat-header">
                <div>
                    <h1>Support Chat</h1>
                    <span class="status-indicator">Online</span>
                </div>
                <div id="escalation-banner" class="escalation-banner hidden">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    Escalation Triggered
                </div>
            </header>

            <div class="chat-history" id="chat-history">
                <div class="message system">
                    <p>Agent connected. Ready to assist.</p>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
                <button id="send-btn" class="primary-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Escalation Modal -->
    <div id="escalation-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h2>Human Handoff Required</h2>
            <div id="escalation-summary" class="markdown-body"></div>
            <button id="close-modal" class="secondary-btn">Close</button>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
